<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>設備点検システム</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>設備点検システム</h1>
</header>

<div class="container">

    <!-- 基本情報 -->

    <section class="card">

        <h2>基本情報</h2>

        <div class="form-group">
            <label>設備名</label>
            <select id="machine">
                <option>ROBOCUT</option>
            </select>
        </div>

        <div class="form-group">
            <label>点検日</label>
            <input type="date" id="inspectionDate">
        </div>

        <div class="form-group">
            <label>点検者</label>
            <input type="text" id="worker" placeholder="氏名入力">
        </div>

    </section>

    <!-- 日常点検 -->

    <section class="card">

        <button class="section-btn">
            日常点検
        </button>

        <div class="inspection-content">

            <div id="dailyList"></div>

        </div>

    </section>

    <!-- 週点検 -->

    <section class="card">

        <button class="section-btn">
            週点検
        </button>

        <div class="inspection-content">

            <div id="weeklyList"></div>

        </div>

    </section>

    <!-- その他 -->

    <section class="card">

        <button class="section-btn">
            その他
        </button>

        <div class="inspection-content">

            <div id="otherList"></div>

        </div>

    </section>

    <!-- 1ヶ月 -->

    <section class="card">

        <button class="section-btn">
            1ヶ月点検
        </button>

        <div class="inspection-content">

            <div id="monthlyList"></div>

        </div>

    </section>

    <!-- 3ヶ月 -->

    <section class="card">

        <button class="section-btn">
            3ヶ月点検
        </button>

        <div class="inspection-content">

            <div id="threeMonthList"></div>

        </div>

    </section>

    <!-- 6ヶ月 -->

    <section class="card">

        <button class="section-btn">
            6ヶ月点検
        </button>

        <div class="inspection-content">

            <div id="sixMonthList"></div>

        </div>

    </section>

    <!-- 1年 -->

    <section class="card">

        <button class="section-btn">
            1年点検
        </button>

        <div class="inspection-content">

            <div id="yearlyList"></div>

        </div>

    </section>

    <!-- 備考 -->

    <section class="card">

        <h2>備考</h2>

        <textarea
            id="memo"
            rows="5"
            placeholder="異常内容・交換内容などを入力">
        </textarea>

    </section>

</div>

<!-- 下部固定ボタン -->

<div class="bottom-buttons">

    <button id="saveBtn" class="save-btn">
        保存
    </button>

    <button id="historyBtn" class="history-btn">
        履歴
    </button>

   <div class="status-buttons">

    <button id="runningBtn" class="status-btn">
        稼働
    </button>

    <button id="stoppedBtn" class="status-btn">
        非稼働
    </button>

</div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>
