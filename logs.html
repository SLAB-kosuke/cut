<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>点検履歴</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    padding:15px;
}

.search-area{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.search-area input,
.search-area select,
.search-area button{
    padding:8px;
}

.log-card{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    background:#fff;
    box-shadow:0 2px 5px rgba(0,0,0,.08);
}

.log-date{
    font-size:18px;
    font-weight:bold;
}

.log-info{
    margin-top:8px;
}

.detail-btn{
    margin-top:10px;
    padding:8px 15px;
}

.detail-area{
    display:none;
    margin-top:15px;
    border-top:1px solid #ddd;
    padding-top:10px;
}

.category{
    margin-top:10px;
}

.category-title{
    background:#f2f2f2;
    padding:8px;
    font-weight:bold;
    border-radius:5px;
    cursor:pointer;
}

.category-content{
    display:none;
    padding:10px;
}

.item-line{
    padding:5px 0;
    border-bottom:1px solid #eee;
}

.memo-box{
    margin-top:15px;
    padding:10px;
    background:#fafafa;
    border-radius:5px;
}

</style>
</head>

<body>

<h2>点検履歴</h2>

<div class="search-area">

<input
    type="date"
    id="dateSearch">

<select id="machineSearch">

    <option value="">
        全設備
    </option>

</select>

<button id="searchBtn">
検索
</button>

<button id="clearBtn">
クリア
</button>

</div>
<hr style="width:100%;border:none;margin:10px 0;">

<button id="excelExportBtn">
    月次Excel出力
</button>
<div id="logContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script type="module" src="./logs.js"></script>

</body>
</html>
