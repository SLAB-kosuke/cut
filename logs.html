<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>点検履歴</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    padding:15px;
}

.search-area{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.search-area input,
.search-area select{
    padding:8px;
}

.history-table{
    width:100%;
    border-collapse:collapse;
}

.history-table th,
.history-table td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}

.detail-row{
    display:none;
}

.detail-box{
    background:#f5f5f5;
    padding:10px;
}

.detail-btn{
    padding:5px 10px;
    cursor:pointer;
}

</style>
</head>

<body>

<h2>点検履歴</h2>

<div class="search-area">

<input
    type="date"
    id="dateSearch">

<select id="machineSearch">

    <option value="">
        全設備
    </option>

</select>

<button id="searchBtn">
検索
</button>

<button id="clearBtn">
クリア
</button>

</div>

<table class="history-table">

<thead>

<tr>
<th>日付</th>
<th>設備</th>
<th>点検者</th>
<th>詳細</th>
</tr>

</thead>

<tbody id="logContainer">

</tbody>

</table>

<script type="module" src="./logs.js"></script>

</body>
</html>
