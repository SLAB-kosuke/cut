<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>設備点検履歴</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<header>
    <h1>設備点検履歴</h1>
</header>

<div class="container">

    <section class="card">

        <h2>検索</h2>

        <div class="form-group">

            <label>点検日</label>

            <input
                type="date"
                id="searchDate">

        </div>

        <div class="form-group">

            <label>点検者</label>

            <input
                type="text"
                id="searchWorker"
                placeholder="点検者名">

        </div>

        <button
            id="searchBtn"
            class="section-btn">

            検索

        </button>

    </section>

    <section class="card">

        <h2>履歴一覧</h2>

        <div id="historyList">

        </div>

    </section>

</div>

<div class="bottom-buttons">

    <button
        id="backBtn"
        class="history-btn">

        入力画面へ戻る

    </button>

</div>

<script type="module" src="logs.js"></script>

</body>
</html>
